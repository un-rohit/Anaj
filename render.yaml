services:
  - type: web
    name: anaj-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate && npx turbo run build --filter=@anaj/api...
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: SMS_PROVIDER
        value: fast2sms
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        value: ANAJKM
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json
      - key: COMPANY_NAME
        value: ANAJ
      - key: COMPANY_EMAIL
        value: anajsellkishan01@gamil.com
      - key: COMPANY_PHONE
        value: "7061654008"
      - key: COMPANY_ADDRESS
        value: "Navaka Tola, Mairwa, Siwan, Bihar, PIN 841239"
